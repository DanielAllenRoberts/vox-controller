[project]
name = "vox"
version = "0.0.1"
description = "Vox — an adaptive voice-controlled command system for macOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "faster-whisper>=1.0.0",
    "psutil>=5.9",
    "anthropic>=0.40",
    "openai>=1.40",
    "claude-agent-sdk>=0.1",
    "python-dotenv>=1.0",
    # openWakeWord's bundled feature models silently return 0.0 scores on
    # onnxruntime >= ~1.21 (verified: 1.27 -> 0.000, 1.20.1 -> 0.999 on the
    # same audio). Pin to a known-good range until openWakeWord catches up.
    "onnxruntime>=1.17,<1.21",
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    # Vosk — grammar-constrained command recognition (idea #53). Small ~50MB "lookahead" model gives
    # a fast, mis-hear-proof fast lane for the fixed command set; free-form still goes to Whisper.
    # Lazy + gated (vosk_commands_enabled, default off) — a missing model/pkg falls back to Whisper.
    "vosk>=0.3.44",
    "mcp>=1.28.0",
    "kokoro-onnx>=0.5.0",
    "pyobjc-framework-avfoundation>=12.2",
    "pyobjc-framework-cocoa>=12.2",
]

[project.scripts]
vox = "vox.core.loop:main"
vox-diagnose = "vox.diagnose:main"

# macOS-only project — restrict universal resolution to darwin so Linux-only
# transitive deps (e.g. openWakeWord's tflite-runtime) don't block resolution.
[tool.uv]
environments = ["sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]
